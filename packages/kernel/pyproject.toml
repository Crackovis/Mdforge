[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdforge-kernel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mdforge-contracts==0.1.0", "packaging>=24.2"]

[tool.uv.sources]
mdforge-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/mdforge_kernel"]
