[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdforge-application"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mdforge-contracts==0.1.0", "mdforge-kernel==0.1.0"]

[tool.uv.sources]
mdforge-contracts = { workspace = true }
mdforge-kernel = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/mdforge_application"]
